# 应用配置
server:
  port: ${SERVER_PORT:19084}
  servlet:
    context-path: /api

spring:
  # 应用名称
  application:
    name: beauty-salon-backend

  # 解决 Springfox 3.0.0 与 Spring Boot 2.6+ 的兼容性问题
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  # 数据源配置（生产环境请通过环境变量注入）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/beauty_salon?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  # Redis 配置
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 5000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1

  # Session 配置
  session:
    store-type: redis
    timeout: 86400

# 安全配置
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:9084,http://127.0.0.1:9084,http://localhost:5174}

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.beautysalon.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置（生产环境必须通过环境变量设置强密钥）
jwt:
  secret: ${JWT_SECRET:beauty-salon-jwt-secret-key-2024-default}
  expiration: ${JWT_EXPIRATION:7200000}        # Access Token 有效期：2小时（毫秒）
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # Refresh Token 有效期：7天（毫秒）
  header: Authorization
  prefix: Bearer

# Swagger 配置（生产环境建议禁用）
springfox:
  documentation:
    enabled: ${SWAGGER_ENABLED:true}
    swagger-ui:
      enabled: ${SWAGGER_ENABLED:true}

# 日志配置
logging:
  level:
    root: INFO
    com.beautysalon: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
